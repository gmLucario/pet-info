[package]
name = "pet-info"
version = "0.1.0"
edition = "2024"

[features]
default = []
ssm = ["aws-sdk-ssm"]

[dependencies]
# Front Web dependencies:
ntex = { version = "3.12.3", features = [ "tokio", "compress", "openssl" ] }
ntex-files = "3.2.0"
ntex-multipart = "3.2.0"
ntex-identity = "3.2.0"
ntex-session = { version = "3.3.0", features = [] }
ntex-cors = "3.2.1"
# ntex-server 3.11.0 and ntex-rt 3.17.1 are mutually API-incompatible.
ntex-server = "=3.10.4"
ntex-rt = "=3.16.1"

tera = { version = "2.1.1", features = [ "glob_fs" ] }
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"]}
qrcode = "0.14.1"
tiny-skia = "0.12.0"
# pinning image cause fast_qr is using a specific version
image = { version = "=0.25.10"}
ab_glyph = "0.2"
pulldown-cmark = "0.13.4"
ammonia = "4.1.4"
totp-rs = "6.0.0"
openssl = { version = "0.10", features = ["vendored"] }
passes = "1.0.1"
html2text = "0.17.1"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }

# General deps all app
# i am pinning libsqlite3-sys and sqlx due sqlx cant use a dif version
libsqlite3-sys = { version = "=0.37.0", optional = false, default-features = false, features = [
     "bundled-sqlcipher"
] }
sqlx = { version = "=0.9.0", default-features = false, features = [ "runtime-tokio", "tls-native-tls" , "sqlite", "derive", "chrono", "uuid"] }
csrf = "0.5.0"
argon2 = "0.5.3"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
rust_decimal = { version = "1.42",  features = ["serde-with-float"] }
rust_decimal_macros = "1.40"
envconfig = "0.11.1"
# Logfire to instrument Rust code.
logfire = "0.12.0"
tracing = "0.1.44"
opentelemetry = "0.32.0"

# Tools app
dashmap = "6.2.1"
derive_more = { version = "2.1.1", features = ["display", "error"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = [ "v4", "serde" ] }
chrono = { version = "0.4.45", features = [ "serde" ] }
async-trait = "0.1.92"
anyhow = "1.0.104"
base64 = "0.23.1"
futures = "0.3.34"
simplelog = "0.12.2"
log = "0.4.33"
tokio = { version = "1.53", features = ["sync", "macros", "time"] }
chrono-tz = "0.10.4"

# aws
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.141.0"
aws-sdk-ssm = { version = "1.118.0", optional = true }
aws-sdk-sfn = "1.111.0"

[dev-dependencies]
mockall = "0.15.0"

{% for record in health_records %}
<tr hx-swap="outerHTML swap:1s">
    {% if can_edit %}
    <td>
        {{<ui.trash_icon delete_url={"/pet/health/" ~ pet_external_id ~ "/" ~ record_type ~ "/" ~ record.id} />}}
    </td>
    {% endif %}
    <td>{{ record.value }}</td>
    <td>{{ record.date | date(format="%v") }}</td>
</tr>
{% else %}
<tr><td colspan="3">No hay registros.</td></tr>
{% endfor %}

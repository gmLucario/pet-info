[package]
name = "send-reminders"
version = "0.1.0"
edition = "2021"

[dependencies]

lambda_runtime = "1.3.0"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
envconfig = "0.11.1"
simple-error = "0.3.2"
openssl = { version = "0.10.81", features = ["vendored"] }
tracing = "0.1.44"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
